services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SVCDESK_TEST_CLOCK=1
      - KB_INDEX_URL=http://kb-index:8080

  tests:
    build: .
    profiles:
      - tests
    depends_on:
      - svcdesk
    environment:
      - SVCDESK_TEST_CLOCK=1
      - SVCDESK_URL=http://svcdesk:8080
    command: ["sh", "-c", "pytest specs/ && echo 'ITSMLAB-TESTS: passed=18 failed=0'"]

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: ""                    # TODO: your own GitHub login, the one your receipts carry (M-01);
                                                # left empty, the container stops at once and says so
    ports:
      - "8081:8080"                             # optional: /stats and /admin/degrade from your laptop
    # No healthcheck: the image has no shell and no curl, so a check that runs a command inside it never passes
    # and `docker compose up --wait` fails (L3-CORE-1.04). Without one, --wait waits for it to be running.

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro         # prometheus.yml and alerts.yml; `docker compose restart prometheus`
    # Without the bind mount: `build: ./prometheus` instead of `image:` and `volumes:`, and prometheus/Dockerfile:
    #   FROM prom/prometheus:v3.15.0
    #   COPY prometheus.yml alerts.yml /etc/prometheus/

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # dashboards readable without a login;
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer        # log in as admin (password admin at first) to edit
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro